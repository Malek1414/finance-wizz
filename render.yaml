services:
  - type: web
    name: finance-wizz-api
    runtime: node
    buildCommand: npm install --prefix backend && npm run build --prefix backend
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finance-wizz-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: finance-wizz-db
    databaseName: finance_wizz
    user: finance_wizz
